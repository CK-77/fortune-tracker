<title>Fortune Tracker</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap');

  :root {
    --bg: #0f0f13;
    --surface: #1a1a22;
    --surface2: #22222e;
    --border: #2e2e3e;
    --text: #f0f0f5;
    --text-muted: #7a7a99;
    --income: #4ade80;
    --expense: #f87171;
    --accent: #818cf8;
    --accent2: #e879f9;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans TC', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    font-size: 14px;
  }

  .app {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    max-width: 480px;
    margin: 0 auto;
  }

  /* HEADER */
  .header { padding: 24px 20px 0; }
  .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
  .header h1 { font-size: 13px; font-weight: 400; color: var(--text-muted); letter-spacing: 2px; text-transform: uppercase; }
  .month-nav { display: flex; align-items: center; gap: 12px; }
  .month-nav button { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 20px; padding: 4px; transition: color 0.2s; }
  .month-nav button:hover { color: var(--text); }
  .month-label { font-family: 'DM Mono', monospace; font-size: 13px; color: var(--text); min-width: 80px; text-align: center; }

  /* SUMMARY CARD */
  .summary {
    margin: 16px 20px;
    background: linear-gradient(135deg, #1e1e2e 0%, #252535 100%);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 20px;
    position: relative;
    overflow: hidden;
  }
  .summary::before {
    content: '';
    position: absolute;
    top: -40px; right: -40px;
    width: 130px; height: 130px;
    background: radial-gradient(circle, rgba(129,140,248,0.18) 0%, transparent 70%);
    border-radius: 50%;
  }
  .summary-label { font-size: 11px; color: var(--text-muted); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 4px; }
  .summary-balance { font-family: 'DM Mono', monospace; font-size: 34px; font-weight: 500; letter-spacing: -1px; margin-bottom: 16px; }
  .summary-balance.positive { color: var(--income); }
  .summary-balance.negative { color: var(--expense); }
  .summary-row { display: flex; gap: 12px; }
  .summary-item { flex: 1; background: rgba(255,255,255,0.04); border-radius: 12px; padding: 10px 12px; }
  .summary-item-label { font-size: 10px; color: var(--text-muted); margin-bottom: 2px; display: flex; align-items: center; gap: 4px; }
  .dot { width: 6px; height: 6px; border-radius: 50%; }
  .dot.income { background: var(--income); }
  .dot.expense { background: var(--expense); }
  .summary-item-amount { font-family: 'DM Mono', monospace; font-size: 15px; font-weight: 500; }
  .summary-item-amount.income { color: var(--income); }
  .summary-item-amount.expense { color: var(--expense); }

  /* TABS */
  .tabs { display: flex; gap: 4px; padding: 0 20px; margin-bottom: 12px; }
  .tab {
    flex: 1; text-align: center; padding: 8px; border-radius: 10px;
    font-size: 12px; cursor: pointer; transition: all 0.2s;
    background: none; border: none; color: var(--text-muted);
    font-family: 'Noto Sans TC', sans-serif;
  }
  .tab.active { background: var(--surface2); color: var(--text); font-weight: 500; }

  /* TRANSACTION LIST */
  .list-section { flex: 1; overflow-y: auto; padding: 0 20px 110px; }
  .date-group { margin-bottom: 16px; }
  .date-label { font-size: 11px; color: var(--text-muted); letter-spacing: 1px; margin-bottom: 8px; padding-left: 2px; }
  .transaction {
    display: flex; align-items: center; gap: 12px;
    background: var(--surface);
    border-radius: 14px;
    padding: 12px 14px;
    margin-bottom: 6px;
    border: 1px solid transparent;
    transition: border-color 0.2s, transform 0.15s;
    cursor: pointer;
  }
  .transaction:hover { border-color: var(--border); transform: translateX(2px); }
  .tx-icon { width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
  .tx-info { flex: 1; min-width: 0; }
  .tx-name { font-size: 13px; font-weight: 500; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tx-cat { font-size: 11px; color: var(--text-muted); }
  .tx-amount { font-family: 'DM Mono', monospace; font-size: 14px; font-weight: 500; flex-shrink: 0; }
  .tx-amount.income { color: var(--income); }
  .tx-amount.expense { color: var(--expense); }

  /* BOTTOM NAV */
  .bottom-nav {
    position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 100%; max-width: 480px;
    background: rgba(15,15,19,0.92); backdrop-filter: blur(20px);
    border-top: 1px solid var(--border);
    display: flex; align-items: center; padding: 12px 20px 24px;
    gap: 8px;
  }
  .nav-btn {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
    background: none; border: none; color: var(--text-muted); cursor: pointer;
    font-size: 10px; padding: 6px; border-radius: 10px; transition: all 0.2s;
    font-family: 'Noto Sans TC', sans-serif;
  }
  .nav-btn.active { color: var(--accent); background: rgba(129,140,248,0.1); }
  .nav-btn svg { width: 20px; height: 20px; }
  .fab {
    width: 54px; height: 54px; border-radius: 16px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border: none; cursor: pointer; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 8px 24px rgba(129,140,248,0.4);
    transition: transform 0.2s, box-shadow 0.2s;
    flex-shrink: 0; margin: -10px 12px 0;
  }
  .fab:hover { transform: scale(1.08); box-shadow: 0 12px 32px rgba(129,140,248,0.5); }
  .fab svg { width: 24px; height: 24px; }

  /* MODAL */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.75); backdrop-filter: blur(8px);
    display: flex; align-items: flex-end; justify-content: center;
    z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.3s;
  }
  .modal-overlay.open { opacity: 1; pointer-events: all; }
  .modal {
    background: var(--surface); border-radius: 28px 28px 0 0;
    width: 100%; max-width: 480px; padding: 24px 20px 40px;
    transform: translateY(100%); transition: transform 0.4s cubic-bezier(0.32, 0.72, 0, 1);
    border: 1px solid var(--border); border-bottom: none;
    max-height: 90vh; overflow-y: auto;
  }

};

async function dbLoad() {
  const r = await fetch(`${SUPABASE_URL}/rest/v1/transactions?order=date.desc`, { headers });
  if (!r.ok) throw new Error('載入失敗');
  const rows = await r.json();
  return rows.map(r => ({

    amount: r.amount,
    originalAmount: r.original_amount,
    currency: r.currency || 'TWD',
    note: r.note || '',
    date: r.date,
    cat: r.cat || 'other',
    payment: r.payment || ''
  }));
}

async function dbInsert(tx) {
  const r = await fetch(`${SUPABASE_URL}/rest/v1/transactions`, {
    method: 'POST',
    headers: headersWrite,
    body: JSON.stringify({
      id: tx.id, type: tx.type, amount: tx.amount,
      original_amount: tx.originalAmount, currency: tx.currency,
      note: tx.note, date: tx.date, cat: tx.cat, payment: tx.payment
    })
  });
  if (!r.ok) {
    const err = await r.text();
    throw new Error('新增失敗: ' + err);
  }
}

async function dbUpdate(tx) {
  const r = await fetch(`${SUPABASE_URL}/rest/v1/transactions?id=eq.${tx.id}`, {
    method: 'PATCH',
    headers: headersWrite,
    body: JSON.stringify({
      type: tx.type, amount: tx.amount,
      original_amount: tx.originalAmount, currency: tx.currency,
      note: tx.note, date: tx.date, cat: tx.cat, payment: tx.payment
    })
  });
  if (!r.ok) {
    const err = await r.text();
    throw new Error('更新失敗: ' + err);
  }
}

async function dbDelete(id) {
  const r = await fetch(`${SUPABASE_URL}/rest/v1/transactions?id=eq.${id}`, {
    method: 'DELETE',
    headers: headersWrite,
  });
  if (!r.ok) {
    const err = await r.text();
    throw new Error('刪除失敗: ' + err);
  }
}

function setLoading(on, msg = '同步中…') {
  const el = document.getElementById('syncIndicator');
  if (on) { el.textContent = '⏳ ' + msg; el.style.display = 'block'; }
  else { el.style.display = 'none'; }
}

function fmt(n) {
  return '$' + Math.abs(n).toLocaleString();
}

function getMonthTxs() {
  return transactions.filter(t => {
    const d = new Date(t.date);
    return d.getMonth() === currentMonth && d.getFullYear() === currentYear;
  });
}

function updateSummary() {
  const txs = getMonthTxs();
  const income = txs.filter(t => t.type === 'income').reduce((s, t) => s + t.amount, 0);
  const expense = txs.filter(t => t.type === 'expense').reduce((s, t) => s + t.amount, 0);
  const balance = income - expense;

  document.getElementById('totalIncome').textContent = fmt(income);
  document.getElementById('totalExpense').textContent = fmt(expense);

  const balEl = document.getElementById('balance');
  balEl.textContent = (balance >= 0 ? '+' : '-') + fmt(balance);
  balEl.className = 'summary-balance ' + (balance >= 0 ? 'positive' : 'negative');
}

function updateList() {
  const filtered = getMonthTxs().filter(t => currentTab === 'all' || t.type === currentTab);
  filtered.sort((a, b) => new Date(b.date) - new Date(a.date));

  const grouped = {};
  filtered.forEach(t => {
    const d = new Date(t.date + 'T00:00:00');
    const key = `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`;
    if (!grouped[key]) grouped[key] = [];
    grouped[key].push(t);
  });

  const list = document.getElementById('txList');

  if (filtered.length === 0) {
    list.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">📝</div>
        <p>這個月還沒有記錄<br>點下方 <strong>+</strong> 按鈕開始記帳吧！</p>
      </div>`;
    return;
  }

  const allCats = [...CATS.expense, ...CATS.income];

  list.innerHTML = Object.entries(grouped).map(([date, items]) => `
    <div class="date-group">
      <div class="date-label">${date}</div>
      ${items.map(t => {
        const cat = allCats.find(c => c.id === t.cat) || { emoji: '📦', name: '其他' };
        const bgColor = t.type === 'income' ? 'rgba(74,222,128,0.12)' : 'rgba(248,113,113,0.12)';
        return `
          <div class="transaction" onclick="openEditModal('${t.id}')">
            <div class="tx-icon" style="background:${bgColor}">${cat.emoji}</div>
            <div class="tx-info">
              <div class="tx-name">${t.note || cat.name}</div>
              <div class="tx-cat">${cat.name}${t.payment ? ' · ' + t.payment : ''}${t.originalAmount && t.currency !== 'TWD' ? ` · <span style="font-family:'DM Mono',monospace">${t.currency} ${Number(t.originalAmount).toLocaleString()}</span>` : ''}</div>
            </div>
            <div style="text-align:right;flex-shrink:0">
              <div class="tx-amount ${t.type}">${t.type === 'income' ? '+' : '-'}${fmt(t.amount)}</div>
              ${t.originalAmount && t.currency !== 'TWD' ? `<div style="font-size:10px;color:var(--text-muted)">≈ TWD</div>` : ''}
            </div>
          </div>`;
      }).join('')}
    </div>`).join('');
}

function render() {
  updateSummary();
  updateList();
}

function changeMonth(dir) {
  currentMonth += dir;
  if (currentMonth > 11) { currentMonth = 0; currentYear++; }
  if (currentMonth < 0) { currentMonth = 11; currentYear--; }
  updateMonthLabel();
  render();
}

function updateMonthLabel() {
  const names = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
  document.getElementById('monthLabel').textContent = currentYear + '/' + names[currentMonth];
}

function setTab(tab, el) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  updateList();
}

let editingId = null;

function openModal() {
  editingId = null;
  document.getElementById('amountInput').value = '';
  document.getElementById('noteInput').value = '';
  document.getElementById('paymentInput').value = '';
  const today = new Date();
  setCalDate(today.getFullYear(), today.getMonth(), today.getDate());
  document.getElementById('amountDisplay').textContent = '$0';
  const savedCurrency = localStorage.getItem('budget_currency') || 'TWD';
  document.getElementById('currencySelect').value = savedCurrency;
  document.getElementById('modalTitle').textContent = '新增記錄';
  document.getElementById('submitBtn').textContent = '✓ 記錄這筆';
  document.getElementById('deleteBtn').style.display = 'none';
  document.getElementById('deletePlaceholder').style.display = 'block';
  setType('expense');
  document.getElementById('modalOverlay').classList.add('open');
  onCurrencyChange();
  setTimeout(() => document.getElementById('amountInput').focus(), 400);
}

function openEditModal(id) {
  const t = transactions.find(tx => tx.id === id);
  if (!t) return;
  editingId = id;

  document.getElementById('modalTitle').textContent = '編輯記錄';
  document.getElementById('submitBtn').textContent = '✓ 儲存變更';
  document.getElementById('deleteBtn').style.display = 'block';
  document.getElementById('deletePlaceholder').style.display = 'none';

  setType(t.type);
  selectedCat = t.cat;
  renderCats();

  const displayAmt = t.originalAmount != null ? t.originalAmount : t.amount;
  document.getElementById('amountInput').value = displayAmt;
  document.getElementById('currencySelect').value = t.currency || 'TWD';
  const dp = new Date(t.date + 'T00:00:00');
  setCalDate(dp.getFullYear(), dp.getMonth(), dp.getDate());
  document.getElementById('noteInput').value = t.note || '';
  document.getElementById('paymentInput').value = t.payment || '';
  document.getElementById('modalOverlay').classList.add('open');
  onCurrencyChange();
  updateAmount();
}

function handleOverlayClick(e) {
  if (e.target === document.getElementById('modalOverlay')) closeModal();
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
}

function setType(type) {
  currentType = type;
  selectedCat = type === 'expense' ? 'food' : 'salary';

  document.getElementById('btnExpense').className = 'type-btn expense' + (type === 'expense' ? ' active' : '');
  document.getElementById('btnIncome').className = 'type-btn income' + (type === 'income' ? ' active' : '');

  const disp = document.getElementById('amountDisplay');
  disp.className = 'amount-display-value ' + type;

  renderCats();
}

function renderCats() {
  document.getElementById('catGrid').innerHTML = CATS[currentType].map(c => `
    <button class="cat-btn ${c.id === selectedCat ? 'selected' : ''}" onclick="selectCat('${c.id}')">
      <span class="cat-emoji">${c.emoji}</span>
      <span class="cat-name">${c.name}</span>
    </button>`).join('');
}

function selectCat(id) {
  selectedCat = id;
  renderCats();
}

// Exchange rates cache: { USD: { rate, date }, ... }
let rateCache = JSON.parse(localStorage.getItem('budget_rates') || '{}');

async function fetchRate(currency) {
  if (currency === 'TWD') return null;
  const today = new Date();
  const dateStr = today.toISOString().split('T')[0];
  // Return cache if fetched today
  if (rateCache[currency] && rateCache[currency].date === dateStr) {
    return rateCache[currency];
  }
  // Try frankfurter.app (supports CORS, uses ECB rates)
  const apis = [
    async () => {
      const r = await fetch(`https://api.frankfurter.app/latest?from=${currency}&to=TWD`);
      const data = await r.json();
      return data.rates.TWD;
    },
    // Fallback: open.er-api.com
    async () => {
      const r = await fetch(`https://open.er-api.com/v6/latest/${currency}`);
      const data = await r.json();
      return data.rates.TWD;
    }
  ];
  for (const api of apis) {
    try {
      const rate = await api();
      if (rate && rate > 0) {
        const entry = { rate: Math.round(rate * 100) / 100, date: dateStr };
        rateCache[currency] = entry;
        localStorage.setItem('budget_rates', JSON.stringify(rateCache));
        return entry;
      }
    } catch (e) { continue; }
  }
  return null;
}

async function onCurrencyChange() {
  const currency = document.getElementById('currencySelect').value;
  localStorage.setItem('budget_currency', currency);
  const twdRow = document.getElementById('twdRow');
  if (currency === 'TWD') {
    twdRow.style.display = 'none';
    updateAmount();
    return;
  }
  twdRow.style.display = 'flex';
  document.getElementById('twdValue').textContent = '載入匯率中…';
  document.getElementById('twdRate').textContent = '';
  const entry = await fetchRate(currency);
  if (entry) {
    document.getElementById('twdRate').textContent = `1 ${currency} = ${entry.rate} TWD（台銀前日收盤中價）`;
  } else {
    document.getElementById('twdRate').textContent = '匯率載入失敗';
  }
  updateAmount();
}

function updateAmount() {
  const val = parseFloat(document.getElementById('amountInput').value) || 0;
  const currency = document.getElementById('currencySelect').value;
  const disp = document.getElementById('amountDisplay');
  disp.textContent = (currency === 'TWD' ? '$' : currency + ' ') + val.toLocaleString();

  if (currency !== 'TWD') {
    const twdRow = document.getElementById('twdRow');
    twdRow.style.display = 'flex';
    const entry = rateCache[currency];
    if (entry && val > 0) {
      const converted = Math.round(val * entry.rate);
      document.getElementById('twdValue').textContent = '$' + converted.toLocaleString();
    } else if (val === 0) {
      document.getElementById('twdValue').textContent = '—';
    }
  }
}

async function submitTransaction() {
  const amount = parseFloat(document.getElementById('amountInput').value);
  const note = document.getElementById('noteInput').value.trim();
  const date = calSelectedDate;
  const payment = document.getElementById('paymentInput').value.trim();
  const currency = document.getElementById('currencySelect').value;

  if (!amount || amount <= 0) { showToast('⚠️ 請輸入有效金額'); return; }
  if (!date) { showToast('⚠️ 請選擇日期'); return; }

  let amountTWD = Math.round(amount);
  if (currency !== 'TWD' && rateCache[currency]) {
    amountTWD = Math.round(amount * rateCache[currency].rate);
  }

  const txData = {
    type: currentType, amount: amountTWD,
    originalAmount: currency !== 'TWD' ? amount : null,
    currency, note, date, cat: selectedCat, payment
  };

  setLoading(true, editingId ? '更新中…' : '儲存中…');
  try {
    if (editingId) {
      const updated = { ...transactions.find(t => t.id === editingId), ...txData };
      await dbUpdate(updated);
      const idx = transactions.findIndex(t => t.id === editingId);
      if (idx !== -1) transactions[idx] = updated;
      showToast('✅ 已更新！');
    } else {
      const newTx = { id: Date.now().toString(), ...txData };
      await dbInsert(newTx);
      transactions.unshift(newTx);
      showToast('✅ 記錄成功！');
    }
    closeModal();
    const d = new Date(date + 'T00:00:00');
    currentMonth = d.getMonth(); currentYear = d.getFullYear();
    updateMonthLabel(); render();
  } catch(e) {
    console.error(e);
    showToast('❌ 儲存失敗：' + e.message);
  } finally {
    setLoading(false);
  }
}

async function deleteFromEdit() {
  if (!editingId) return;
  if (!confirm('要刪除這筆記錄嗎？')) return;
  setLoading(true, '刪除中…');
  try {
    await dbDelete(editingId);
    transactions = transactions.filter(t => t.id !== editingId);
    closeModal(); render(); showToast('🗑️ 已刪除');
  } catch(e) {
    console.error(e);
    showToast('❌ 刪除失敗：' + e.message);
  } finally { setLoading(false); }
}

async function confirmDelete(id) {
  if (!confirm('要刪除這筆記錄嗎？')) return;
  setLoading(true, '刪除中…');
  try {
    await dbDelete(id);
    transactions = transactions.filter(t => t.id !== id);
    render(); showToast('🗑️ 已刪除');
  } catch(e) {
    showToast('❌ 刪除失敗，請檢查網路');
  } finally { setLoading(false); }
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// ── SETTINGS ──────────────────────────────────────
let editingCatId = null;

function saveExpenseCats() {
  localStorage.setItem('budget_expense_cats', JSON.stringify(CATS.expense));
}

function openSettings() {
  renderSettingsCatList();
  document.getElementById('settingsOverlay').classList.add('open');
}

function closeSettings() {
  document.getElementById('settingsOverlay').classList.remove('open');
}

function handleSettingsOverlayClick(e) {
  if (e.target === document.getElementById('settingsOverlay')) closeSettings();
}

function renderSettingsCatList() {
  document.getElementById('settingsCatList').innerHTML = CATS.expense.map(c => `
    <div style="display:flex;align-items:center;gap:12px;background:var(--surface2);border-radius:14px;padding:12px 14px;margin-bottom:8px;cursor:pointer;border:1px solid transparent;transition:border-color 0.2s"
      onclick="openEditCat('${c.id}')"
      onmouseover="this.style.borderColor='var(--border)'"
      onmouseout="this.style.borderColor='transparent'">
      <span style="font-size:24px;width:36px;text-align:center">${c.emoji}</span>
      <span style="flex:1;font-size:14px;font-weight:500">${c.name}</span>
      <span style="color:var(--text-muted);font-size:12px">編輯 ›</span>
    </div>`).join('');
}

function openEditCat(id) {
  const cat = CATS.expense.find(c => c.id === id);
  if (!cat) return;
  editingCatId = id;
  document.getElementById('editCatEmoji').value = cat.emoji;
  document.getElementById('editCatName').value = cat.name;
  document.getElementById('editCatEmojiPreview').textContent = cat.emoji;
  // Hide delete for built-in cats that have existing transactions
  document.getElementById('editCatDeleteBtn').style.display = 'block';
  document.getElementById('editCatOverlay').classList.add('open');
}

function closeEditCat() {
  document.getElementById('editCatOverlay').classList.remove('open');
  editingCatId = null;
}

function handleEditCatOverlayClick(e) {
  if (e.target === document.getElementById('editCatOverlay')) closeEditCat();
}

function saveEditCat() {
  const emoji = document.getElementById('editCatEmoji').value.trim();
  const name = document.getElementById('editCatName').value.trim();
  if (!emoji) { showToast('⚠️ 請輸入 emoji'); return; }
  if (!name) { showToast('⚠️ 請輸入分類名稱'); return; }
  const idx = CATS.expense.findIndex(c => c.id === editingCatId);
  if (idx !== -1) {
    CATS.expense[idx] = { ...CATS.expense[idx], emoji, name };
    saveExpenseCats();
    renderSettingsCatList();
    closeEditCat();
    showToast('✅ 分類已更新！');
  }
}

function addExpenseCat() {
  const newId = 'custom_' + Date.now();
  CATS.expense.push({ id: newId, emoji: '📦', name: '新分類' });
  saveExpenseCats();
  openEditCat(newId);
  renderSettingsCatList();
}

function deleteExpenseCat() {
  if (!editingCatId) return;
  if (CATS.expense.length <= 1) { showToast('⚠️ 至少保留一個分類'); return; }
  const cat = CATS.expense.find(c => c.id === editingCatId);
  if (!confirm(`確定刪除「${cat.emoji} ${cat.name}」分類嗎？\n（已記錄的帳目不受影響）`)) return;
  CATS.expense = CATS.expense.filter(c => c.id !== editingCatId);
  saveExpenseCats();
  closeEditCat();
  renderSettingsCatList();
  showToast('🗑️ 分類已刪除');
}
// ──────────────────────────────────────────────────

// ── CALENDAR ──────────────────────────────────────
let calSelectedDate = null; // 'YYYY-MM-DD'
let calViewYear = new Date().getFullYear();
let calViewMonth = new Date().getMonth();

function setCalDate(y, m, d) {
  calSelectedDate = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  calViewYear = y; calViewMonth = m;
  // Sync manual input field
  const manualEl = document.getElementById('dateManualInput');
  if (manualEl) manualEl.value = `${y}/${String(m+1).padStart(2,'0')}/${String(d).padStart(2,'0')}`;
  renderCalDays();
  document.getElementById('calPopup').classList.remove('open');
}

function onDateManualInput(val) {
  // Auto-insert slashes: 2025 → 2025/ → 2025/05 → 2025/05/
  let digits = val.replace(/\D/g, '');
  let formatted = digits;
  if (digits.length > 4) formatted = digits.slice(0,4) + '/' + digits.slice(4);
  if (digits.length > 6) formatted = digits.slice(0,4) + '/' + digits.slice(4,6) + '/' + digits.slice(6,8);
  const el = document.getElementById('dateManualInput');
  if (el.value !== formatted) el.value = formatted;

  // Parse when full date entered
  if (digits.length === 8) {
    const y = parseInt(digits.slice(0,4));
    const m = parseInt(digits.slice(4,6)) - 1;
    const d = parseInt(digits.slice(6,8));
    const date = new Date(y, m, d);
    if (!isNaN(date) && date.getFullYear()===y && date.getMonth()===m && date.getDate()===d) {
      calSelectedDate = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      calViewYear = y; calViewMonth = m;
      renderCalDays();
    }
  } else {
    calSelectedDate = null;
  }
}

function toggleCal() {
  const popup = document.getElementById('calPopup');
  popup.classList.toggle('open');
  if (popup.classList.contains('open')) renderCalDays();
}

function calChangeMonth(dir) {
  calViewMonth += dir;
  if (calViewMonth > 11) { calViewMonth = 0; calViewYear++; }
  if (calViewMonth < 0) { calViewMonth = 11; calViewYear--; }
  renderCalDays();
}

function renderCalDays() {
  const monthNames = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
  document.getElementById('calMonthLabel').textContent = `${calViewYear} 年 ${monthNames[calViewMonth]}`;

  const today = new Date();
  const firstDay = new Date(calViewYear, calViewMonth, 1).getDay();
  const daysInMonth = new Date(calViewYear, calViewMonth + 1, 0).getDate();
  const daysInPrev = new Date(calViewYear, calViewMonth, 0).getDate();

  let html = '';
  // Prev month trailing days
  for (let i = firstDay - 1; i >= 0; i--) {
    const d = daysInPrev - i;
    html += `<button class="cal-day other-month" onclick="calGoTo(${calViewYear},${calViewMonth-1},${d})">${d}</button>`;
  }
  // Current month days
  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = `${calViewYear}-${String(calViewMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isToday = today.getFullYear()===calViewYear && today.getMonth()===calViewMonth && today.getDate()===d;
    const isSelected = calSelectedDate === dateStr;
    const cls = ['cal-day', isToday?'today':'', isSelected?'selected':''].filter(Boolean).join(' ');
    html += `<button class="${cls}" onclick="setCalDate(${calViewYear},${calViewMonth},${d})">${d}</button>`;
  }
  // Next month leading days
  const total = firstDay + daysInMonth;
  const remaining = total % 7 === 0 ? 0 : 7 - (total % 7);
  for (let d = 1; d <= remaining; d++) {
    html += `<button class="cal-day other-month" onclick="calGoTo(${calViewYear},${calViewMonth+1},${d})">${d}</button>`;
  }

  document.getElementById('calDays').innerHTML = html;
}

function calGoTo(y, m, d) {
  if (m < 0) { m = 11; y--; }
  if (m > 11) { m = 0; y++; }
  setCalDate(y, m, d);
}
// ──────────────────────────────────────────────────

// 初始化
updateMonthLabel();
renderCats();

(async () => {
  setLoading(true, '載入資料中…');
  try {
    transactions = await dbLoad();
  } catch(e) {
    showToast('⚠️ 無法連線，顯示本機暫存');
    transactions = JSON.parse(localStorage.getItem('budget_app_txs_cache') || '[]');
  } finally {
    setLoading(false);
  }
  // 更新本機快取供離線使用
  localStorage.setItem('budget_app_txs_cache', JSON.stringify(transactions));
  render();
})();
</script>
